<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHESS w/ alp</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
:root{
  --sq:70px;
  --light-sq:#1a2535;
  --dark-sq:#0c1018;
  --green:#00ff41;
  --red:#ff2020;
  --soul:#ffff00;
}
@media(max-width:640px){:root{--sq:46px;}}
@media(max-width:400px){:root{--sq:38px;}}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#000;color:#fff;font-family:'Press Start 2P',monospace;overflow:hidden;}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;}
#screen-game{display:none;justify-content:flex-start;padding:14px 10px 8px;overflow-y:auto;}

/* CRT noise canvas */
#crt{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* scanlines on intro */
#screen-intro::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:2;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.4),rgba(0,0,0,.4) 1px,transparent 1px,transparent 3px);
}
/* subtle scanlines on game */
#screen-game::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,255,65,.012) 3px,rgba(0,255,65,.012) 4px);
}

/* ── INTRO ── */
#screen-intro{z-index:10;}
#intro-inner{position:relative;z-index:5;text-align:center;display:flex;flex-direction:column;align-items:center;}
#sprite-wrap{margin-bottom:28px;animation:float 2.2s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-11px);}}

#intro-title{
  font-size:clamp(15px,3.5vw,26px);
  letter-spacing:.06em;line-height:2;color:#fff;
  animation:glitch 5s infinite;
  position:relative;z-index:5;
}
#intro-title .alp{color:var(--red);}
#intro-title .sub{display:block;font-size:clamp(7px,1.1vw,9px);color:#555;letter-spacing:.12em;margin-top:4px;}

@keyframes glitch{
  0%,80%,100%{text-shadow:0 0 16px rgba(255,255,255,.25);transform:none;filter:none;}
  81%{text-shadow:-3px 0 #ff2020,3px 0 #00ff41;transform:skewX(-1.5deg);filter:brightness(1.5);}
  82%{text-shadow:none;transform:translateX(3px);filter:brightness(.6);}
  83%{text-shadow:3px 0 #ff2020,-3px 0 #00ff41;transform:skewX(1deg);filter:brightness(1.4);}
  85%{text-shadow:0 0 16px rgba(255,255,255,.25);transform:none;filter:none;}
  86%{transform:translateX(-2px);filter:hue-rotate(90deg);}
  87%{transform:none;filter:none;}
}

/* moving glitch bars */
.gbar{
  position:absolute;left:0;right:0;z-index:3;pointer-events:none;
  background:rgba(255,255,255,.05);
  mix-blend-mode:screen;
  animation:gbar var(--gd) linear infinite var(--gdl);
}
@keyframes gbar{
  0%{top:-30px;opacity:0;}5%{opacity:1;}90%{opacity:.8;}100%{top:110%;opacity:0;}
}

/* rgb aberration overlay */
#rgb-overlay{
  position:absolute;inset:0;z-index:4;pointer-events:none;
  animation:rgb 7s infinite;
}
@keyframes rgb{
  0%,74%,100%{opacity:0;}
  75%{opacity:1;background:linear-gradient(180deg,rgba(255,0,0,.07) 0%,rgba(0,255,0,.05) 50%,rgba(0,0,255,.07) 100%);}
  77%{opacity:0;}
  78%{opacity:1;background:linear-gradient(90deg,rgba(0,0,255,.08) 0%,rgba(255,0,0,.06) 100%);}
  80%{opacity:0;}
}

/* white flash */
#flash{position:absolute;inset:0;z-index:6;pointer-events:none;background:#fff;animation:flash 5s infinite;}
@keyframes flash{
  0%,79%,81%,100%{opacity:0;}
  80%{opacity:.18;}
}

#start-btn{
  font-family:'Press Start 2P',monospace;
  font-size:clamp(11px,2vw,14px);
  padding:18px 44px;border:3px solid #fff;background:transparent;color:#fff;
  cursor:pointer;letter-spacing:.14em;margin-top:38px;
  position:relative;overflow:hidden;transition:color .12s;z-index:5;
}
#start-btn::after{content:'';position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:left;transition:transform .14s;z-index:-1;}
#start-btn:hover{color:#000;}
#start-btn:hover::after{transform:scaleX(1);}
.blink{animation:blink .85s step-end infinite;}
@keyframes blink{50%{opacity:0;}}

/* ── GAME ── */
#g-header{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:680px;margin-bottom:10px;flex-shrink:0;}
#g-logo{font-size:clamp(9px,1.5vw,11px);letter-spacing:.08em;}
#g-logo .alp{color:var(--red);}

#dialog{
  width:100%;max-width:680px;border:3px solid #fff;padding:12px 18px;margin-bottom:12px;
  display:flex;align-items:center;gap:12px;background:#000;flex-shrink:0;min-height:50px;
}
#d-icon{font-size:14px;color:var(--red);flex-shrink:0;animation:hbeat 1.1s ease-in-out infinite;}
@keyframes hbeat{0%,100%{transform:scale(1);}50%{transform:scale(1.35);}}
#d-icon.think{color:var(--soul);animation:dspin 1s linear infinite;}
@keyframes dspin{to{transform:rotate(360deg);}}
#d-msg{font-size:clamp(7px,1.2vw,9px);letter-spacing:.05em;line-height:2;color:#fff;}

#board-area{display:flex;gap:5px;align-items:flex-start;}
#rlabels{display:flex;flex-direction:column;padding-right:4px;}
.rl{font-size:7px;color:#333;height:var(--sq);line-height:var(--sq);width:10px;text-align:right;}
#board-col{display:flex;flex-direction:column;}
#board{
  display:grid;
  grid-template-columns:repeat(8,var(--sq));
  grid-template-rows:repeat(8,var(--sq));
  border:3px solid #fff;
  box-shadow:0 0 0 1px #fff,0 0 40px rgba(255,255,255,.07);
}
#flabels{display:flex;padding-top:4px;}
.fl{font-size:7px;color:#333;width:var(--sq);text-align:center;}

.sq{width:var(--sq);height:var(--sq);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;}
.sq.light{background:var(--light-sq);}
.sq.dark{background:var(--dark-sq);}
.sq.sel{background:rgba(255,255,0,.28)!important;}
.sq.lf{background:rgba(255,255,0,.1)!important;}
.sq.lt{background:rgba(255,255,0,.22)!important;}
.sq.chk{background:rgba(255,30,30,.5)!important;}
.sq.dot::after{content:'';position:absolute;width:32%;height:32%;background:rgba(0,255,65,.65);border-radius:50%;box-shadow:0 0 8px var(--green);pointer-events:none;}
.sq.cap::after{content:'';position:absolute;inset:4px;border:2px solid rgba(0,255,65,.65);box-shadow:0 0 8px var(--green);pointer-events:none;}
.piece-svg{width:88%;height:88%;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.95));}

#hist{width:100%;max-width:680px;border:2px solid #181818;padding:7px 12px;margin-top:8px;min-height:30px;max-height:44px;overflow-y:auto;background:#000;flex-shrink:0;}
.hn{color:#2a2a2a;font-size:7px;line-height:2.1;}
.hm{color:#666;font-size:7px;line-height:2.1;}
.hm.hl{color:#fff;}

#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:500;align-items:center;justify-content:center;}
#overlay.on{display:flex;}
#over-box{border:3px solid #fff;padding:38px 48px;text-align:center;background:#000;box-shadow:0 0 80px rgba(255,255,255,.06);max-width:400px;width:90%;}
#over-title{font-size:clamp(13px,3vw,20px);color:#fff;margin-bottom:14px;line-height:1.6;}
#over-sub{font-size:8px;color:#555;margin-bottom:28px;letter-spacing:.07em;line-height:2.2;}
#over-btn{font-family:'Press Start 2P',monospace;font-size:9px;padding:14px 24px;border:2px solid #fff;background:transparent;color:#fff;cursor:pointer;letter-spacing:.08em;}
#over-btn:hover{background:#fff;color:#000;}
</style>
</head>
<body>

<canvas id="crt"></canvas>

<!-- INTRO -->
<div class="screen" id="screen-intro">
  <!-- glitch bars injected by JS -->
  <div id="rgb-overlay"></div>
  <div id="flash"></div>
  <div id="intro-inner">
    <div id="sprite-wrap">
      <canvas id="sprite-cv" width="64" height="64"
        style="width:96px;height:96px;image-rendering:pixelated;"></canvas>
    </div>
    <div id="intro-title">
      CHESS w/ <span class="alp">alp</span>
      <span class="sub">bot, of course</span>
    </div>
    <button id="start-btn" onclick="startGame()">
      <span class="blink">▶</span> START
    </button>
  </div>
</div>

<!-- GAME -->
<div class="screen" id="screen-game">
  <div id="g-header">
    <div id="g-logo">CHESS w/ <span class="alp">alp</span></div>
    <button style="font-family:'Press Start 2P',monospace;font-size:7px;padding:8px 12px;border:1px solid #2a2a2a;background:transparent;color:#444;cursor:pointer;" onclick="goMenu()">⌂</button>
  </div>
  <div id="dialog">
    <div id="d-icon">♥</div>
    <div id="d-msg">your move.</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;width:100%;">
    <div id="board-area">
      <div id="rlabels"></div>
      <div id="board-col">
        <div id="board"></div>
        <div id="flabels"></div>
      </div>
    </div>
    <div id="hist"><span class="hn" style="color:#1a1a1a;">— no moves yet —</span></div>
  </div>
</div>

<!-- OVERLAY -->
<div id="overlay">
  <div id="over-box">
    <div id="over-title"></div>
    <div id="over-sub"></div>
    <button id="over-btn" onclick="closeOver();newGame()">▶ PLAY AGAIN</button>
  </div>
</div>

<script>
/* ── CRT NOISE ── */
(function(){
  const cv=document.getElementById('crt');
  const cx=cv.getContext('2d');
  let W,H,img;
  function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;img=cx.createImageData(W,H);}
  addEventListener('resize',resize);resize();
  let scanY=0;
  function tick(){
    const d=img.data;
    /* sparse noise */
    for(let i=0;i<d.length;i+=4){
      const v=Math.random()<.025?Math.floor(Math.random()*255):0;
      d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;
    }
    /* moving bright scan band */
    scanY=(scanY+1.2)%H;
    for(let x=0;x<W;x++){
      const i=(Math.floor(scanY)*W+x)*4;
      if(i>=0&&i<d.length-3){d[i]=d[i+1]=d[i+2]=60;d[i+3]=255;}
    }
    /* occasional glitch row */
    if(Math.random()<.07){
      const gy=Math.floor(Math.random()*H);
      const gh=Math.floor(1+Math.random()*4);
      for(let r=gy;r<Math.min(gy+gh,H);r++){
        const shift=Math.floor(-25+Math.random()*50);
        for(let c=0;c<W;c++){
          const src=((r*W)+((c+shift+W)%W))*4;
          const dst=(r*W+c)*4;
          d[dst]=d[dst+1]=d[dst+2]=Math.random()<.4?220:10;d[dst+3]=255;
        }
      }
    }
    cx.putImageData(img,0,0);
    requestAnimationFrame(tick);
  }
  tick();
  cv.style.cssText='position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.14;';
})();

/* ── GLITCH BARS ── */
(function(){
  const intro=document.getElementById('screen-intro');
  for(let i=0;i<7;i++){
    const b=document.createElement('div');
    b.className='gbar';
    const h=1+Math.random()*20;
    b.style.cssText=`height:${h}px;top:${Math.random()*90}%;--gd:${2.5+Math.random()*9}s;--gdl:-${Math.random()*6}s;z-index:3;`;
    intro.appendChild(b);
  }
})();

/* ── PIXEL KNIGHT SPRITE ── */
(function(){
  const cv=document.getElementById('sprite-cv');
  const cx=cv.getContext('2d');
  cx.imageSmoothingEnabled=false;
  // W=white, D=dark outline, .=transparent
  const F=[
    // frame 0
    [".....DD.........",
     "....DWWD........",
     "...DWWWWD.......",
     "..DDWWWWWD......",
     "..DWWDDWWD......",
     "..DWWWWWWD......",
     "...DDWWWDD......",
     "..DDWWWWWDD.....",
     ".DWWWWWWWWD.....",
     ".DWWWWWWWWD.....",
     "..DDWWWWDD......",
     "...DWWWDD.......",
     "...DWWWD........",
     "..DDWWWDD.......",
     "..DDDDDDD.......",
     "................"],
    // frame 1 — legs shifted
    [".....DD.........",
     "....DWWD........",
     "...DWWWWD.......",
     "..DDWWWWWD......",
     "..DWWDDWWD......",
     "..DWWWWWWD......",
     "...DDWWWDD......",
     "..DDWWWWWDD.....",
     ".DWWWWWWWWD.....",
     ".DWWWWWWWWD.....",
     "..DDWWWWDD......",
     "...DWWWDD.......",
     "....DWWDD.......",
     "....DDDDD.......",
     "................",
     "................"],
  ];
  const pal={W:'#f0f0f0',D:'#2a2a2a'};
  let fr=0,t=0;
  function draw(){
    cx.clearRect(0,0,64,64);
    F[fr].forEach((row,r)=>[...row].forEach((ch,c)=>{
      if(ch==='.')return;
      cx.fillStyle=pal[ch];
      cx.fillRect(c*4,r*4,4,4);
    }));
    // red eye at col 7, row 4
    cx.fillStyle='#ff2020';cx.fillRect(7*4,4*4,4,4);
    if(++t%22===0)fr^=1;
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ── AUDIO ── */
let AC;
function getAC(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();AC.resume();return AC;}
function tone(f,d,type,v,delay){
  type=type||'square';v=v||.12;delay=delay||0;
  try{
    const a=getAC(),o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);
    o.type=type;
    o.frequency.setValueAtTime(f,a.currentTime+delay);
    o.frequency.exponentialRampToValueAtTime(f*.5,a.currentTime+delay+d);
    g.gain.setValueAtTime(v,a.currentTime+delay);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+delay+d);
    o.start(a.currentTime+delay);o.stop(a.currentTime+delay+d);
  }catch(e){}
}
var sfx={
  move:  function(){tone(440,.07);tone(660,.05,'square',.12,.08);},
  cap:   function(){tone(200,.05,'sawtooth');tone(150,.09,'sawtooth',.12,.06);},
  sel:   function(){tone(523,.04,'square',.07);},
  err:   function(){tone(110,.09,'square',.07);},
  check: function(){tone(880,.06);tone(440,.1,'square',.12,.09);},
  win:   function(){[523,659,784,1047,1319].forEach(function(f,i){tone(f,.13,'square',.13,i*.11);});},
  lose:  function(){[392,330,262,196].forEach(function(f,i){tone(f,.17,'sawtooth',.13,i*.15);});},
  draw:  function(){tone(440,.1);tone(440,.1,'square',.1,.23);}
};

/* ── STOCKFISH ── */
var engine=null,engReady=false,engCB=null;

function initEngine(cb){
  if(engine)engine.terminate();
  engReady=false;engCB=null;
  engine=new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
  engine.onmessage=function(e){
    var l=e.data;
    if(l==='uciok'){
      engine.postMessage('setoption name Skill Level value 1');
      engine.postMessage('setoption name UCI_LimitStrength value true');
      engine.postMessage('setoption name UCI_Elo value 800');
      engine.postMessage('isready');
    } else if(l==='readyok'){
      engReady=true;
      if(cb)cb();
    } else if(l.indexOf('bestmove')===0&&engCB){
      var mv=l.split(' ')[1];
      var fn=engCB;engCB=null;
      fn(mv==='(none)'?null:mv);
    }
  };
  engine.postMessage('uci');
}

function engineGo(fen,cb){
  if(!engReady){setTimeout(function(){engineGo(fen,cb);},300);return;}
  engCB=cb;
  engine.postMessage('ucinewgame');
  engine.postMessage('position fen '+fen);
  engine.postMessage('go depth 8 movetime 900');
}

/* ── GAME ── */
var chess=new Chess();
var selected=null,legalTgts=[],lastMove=null;
var gameOver=false,thinking=false,moveHist=[];

function startGame(){
  getAC();
  document.getElementById('screen-intro').style.display='none';
  document.getElementById('screen-game').style.display='flex';
  render(); // show board immediately before engine loads
  updateHist();
  setDialog('loading engine...');
  initEngine(function(){newGame();});
}

function goMenu(){
  document.getElementById('screen-game').style.display='none';
  document.getElementById('screen-intro').style.display='flex';
}

function newGame(){
  chess.reset();
  selected=null;legalTgts=[];lastMove=null;
  gameOver=false;thinking=false;moveHist=[];
  closeOver();render();updateHist();
  setDialog('your move.');
}

function sq(f,r){return String.fromCharCode(97+f)+(r+1);}

function render(){
  var bd=document.getElementById('board');
  var rl=document.getElementById('rlabels');
  var fl=document.getElementById('flabels');
  bd.innerHTML='';rl.innerHTML='';fl.innerHTML='';

  for(var r=0;r<8;r++){
    var rank=7-r;
    var d=document.createElement('div');
    d.className='rl';d.textContent=rank+1;
    rl.appendChild(d);
  }
  var files='abcdefgh';
  for(var c=0;c<8;c++){
    var d2=document.createElement('div');
    d2.className='fl';d2.textContent=files[c];
    fl.appendChild(d2);
  }

  var kSq=null;
  if(chess.in_check()){
    var brd=chess.board();
    outer:for(var rr=7;rr>=0;rr--)
      for(var ff=0;ff<8;ff++){
        var p=brd[rr][ff];
        if(p&&p.type==='k'&&p.color===chess.turn()){kSq=sq(ff,7-rr);break outer;}
      }
  }

  for(var row=0;row<8;row++){
    for(var col=0;col<8;col++){
      var rank2=7-row;var file2=col;
      var s=sq(file2,rank2);
      var piece=chess.get(s);
      var light=(file2+rank2)%2===1;
      var div=document.createElement('div');
      div.className='sq '+(light?'light':'dark');
      if(s===selected)div.classList.add('sel');
      if(lastMove){if(s===lastMove.from)div.classList.add('lf');if(s===lastMove.to)div.classList.add('lt');}
      if(s===kSq)div.classList.add('chk');
      if(legalTgts.indexOf(s)>=0)div.classList.add(piece?'cap':'dot');
      if(piece)div.innerHTML=pieceSVG(piece.type,piece.color);
      (function(sq2){div.addEventListener('click',function(){onSq(sq2);});})(s);
      bd.appendChild(div);
    }
  }
}

function onSq(s){
  if(gameOver||thinking)return;
  if(chess.turn()!=='w')return;
  var piece=chess.get(s);
  if(selected){
    if(legalTgts.indexOf(s)>=0){doMove(selected,s);return;}
    selected=null;legalTgts=[];
  }
  if(piece&&piece.color==='w'){
    selected=s;
    legalTgts=chess.moves({square:s,verbose:true}).map(function(m){return m.to;});
    sfx.sel();
  } else sfx.err();
  render();
}

function doMove(from,to){
  var piece=chess.get(from);
  var promo;
  if(piece&&piece.type==='p'&&parseInt(to[1])===8)promo='q';
  var wasCap=!!chess.get(to)||(piece&&piece.type==='p'&&from[0]!==to[0]);
  var move=chess.move({from:from,to:to,promotion:promo});
  if(!move)return;
  lastMove={from:from,to:to};selected=null;legalTgts=[];
  moveHist.push(move);
  wasCap?sfx.cap():sfx.move();
  if(chess.in_check())sfx.check();
  updateHist();render();
  if(checkOver())return;
  setTimeout(botMove,380);
}

function botMove(){
  if(gameOver)return;
  thinking=true;
  setDialog('alp is thinking...',true);
  engineGo(chess.fen(),function(bm){
    thinking=false;
    if(!bm||gameOver)return;
    var from=bm.slice(0,2),to=bm.slice(2,4),promo=bm[4]||undefined;
    var wasCap=!!chess.get(to);
    var move=chess.move({from:from,to:to,promotion:promo});
    if(!move){setDialog('your move.');return;}
    lastMove={from:from,to:to};moveHist.push(move);
    wasCap?sfx.cap():sfx.move();
    if(chess.in_check())sfx.check();
    updateHist();render();
    if(!checkOver())setDialog('your move.');
  });
}

function checkOver(){
  if(chess.in_checkmate()){
    var won=chess.turn()==='b';
    if(won){sfx.win();showOver('you won.','checkmate — well played.\ncongratulations.');}
    else   {sfx.lose();showOver('you lost.','checkmate — but no worries.\nwanna run it back?');}
    gameOver=true;return true;
  }
  if(chess.in_draw()){
    var r='draw.';
    if(chess.in_stalemate())r='stalemate.';
    else if(chess.in_threefold_repetition())r='threefold repetition.';
    else if(chess.insufficient_material())r='insufficient material.';
    sfx.draw();showOver('draw.',r);
    gameOver=true;return true;
  }
  return false;
}

function setDialog(txt,spin){
  document.getElementById('d-msg').textContent=txt;
  var h=document.getElementById('d-icon');
  h.className=spin?'think':'';h.textContent=spin?'◈':'♥';
}
function showOver(title,sub){
  document.getElementById('over-title').textContent=title;
  document.getElementById('over-sub').textContent=sub;
  document.getElementById('overlay').classList.add('on');
}
function closeOver(){document.getElementById('overlay').classList.remove('on');}
function updateHist(){
  var el=document.getElementById('hist');
  if(!moveHist.length){el.innerHTML='<span class="hn" style="color:#1a1a1a;">— no moves yet —</span>';return;}
  var h='';
  moveHist.forEach(function(m,i){
    if(i%2===0)h+='<span class="hn">'+Math.floor(i/2+1)+'. </span>';
    h+='<span class="hm'+(i===moveHist.length-1?' hl':'')+'">'+m.san+' </span>';
  });
  el.innerHTML=h;el.scrollTop=el.scrollHeight;
}
</script>
</body>
</html>
